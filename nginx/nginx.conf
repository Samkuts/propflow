upstream backend {
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    # Allow larger file uploads (for document uploads)
    client_max_body_size 20m;

    # Increase timeout for slow Stripe/Checkr API calls
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # ── Backend API proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Webhook proxy (must preserve raw body — nginx is transparent here) ───
    location /webhooks/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable buffering so raw body reaches backend intact
        proxy_request_buffering off;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ── React SPA — catch-all ─────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: unknown routes serve index.html (React Router handles them)
        try_files $uri $uri/ /index.html;
    }
}
